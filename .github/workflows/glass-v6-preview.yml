name: Publish Glass V6 preview

on:
  push:
    branches:
      - redesign/glass-v6

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build static preview
        env:
          NEXT_PUBLIC_BASE_PATH: /Hunter20041004/ftl-web-demo/preview-glass-v6
        run: npm run build
      - name: Publish preview-glass-v6 branch
        shell: bash
        run: |
          rm -rf /tmp/ftl-glass-v6
          mkdir -p /tmp/ftl-glass-v6
          cp -a out/. /tmp/ftl-glass-v6/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview-glass-v6
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ftl-glass-v6/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: glass v6 redesign preview"
          git push --force origin preview-glass-v6
