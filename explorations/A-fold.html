<!DOCTYPE html><html lang="zh-Hant-TW"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 A — 摺帶</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
body{background:#fff}
/* ══ 摺帶：logo 的本體就是一條摺疊、交疊的絲帶。把它變成整站的結構裝置 ══ */
.nav{position:relative;z-index:5;height:78px;display:flex;align-items:center;gap:28px}
.nav img{height:44px;filter:brightness(0) invert(1)}
.nav a{font-size:14px;font-weight:700;color:rgba(255,255,255,.82)}
.nav a[aria-current]{color:#fff}
.nav .r{margin-left:auto;display:flex;gap:22px;align-items:center}

.hero{position:relative;background:var(--b-deep);color:#fff;overflow:hidden;padding-bottom:150px}
/* 摺痕：三段不同色階的帶子交疊，模仿 logo 的摺與疊 */
.ribbon{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero .in{position:relative;z-index:2;padding-top:56px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;
  letter-spacing:.2em;text-transform:uppercase;color:#9FC4FF;margin-bottom:26px}
.kicker::before{content:'';width:26px;height:3px;border-radius:2px;background:var(--b-hi)}
h1{font-size:clamp(46px,6.4vw,88px);font-weight:900;line-height:1.04;letter-spacing:-.05em}
h1 em{font-style:normal;color:var(--b-hi)}
.sub{margin-top:26px;font-size:18px;font-weight:700;color:rgba(255,255,255,.92);max-width:34ch}
.desc{margin-top:16px;font-size:15.5px;line-height:1.85;color:rgba(255,255,255,.8);max-width:40ch}
.cta{margin-top:38px;display:flex;gap:12px;flex-wrap:wrap}
.btn{height:50px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;gap:9px;
  font-size:15px;font-weight:900;background:#fff;color:var(--b-deep);border:2px solid #fff}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
/* 摺帶的圓鈍收尾：直接沿用 logo 的端點語彙 */
.capstrip{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;display:flex;align-items:flex-end}
.capstrip i{display:block;height:100%;border-radius:80px 80px 0 0}
.capstrip i:nth-child(1){flex:1.4;background:var(--b-dk)}
.capstrip i:nth-child(2){flex:2.2;background:var(--b);margin-left:-46px}
.capstrip i:nth-child(3){flex:1.1;background:var(--b-lt);margin-left:-46px}
.capstrip i:nth-child(4){flex:.7;background:var(--b-hi);margin-left:-46px}

/* 內容區：白底，但每個區塊的頭尾都用摺帶的圓鈍端當標記 */
.sec{padding:96px 0}
.lbl{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.lbl b{font-family:var(--f-en);font-size:13px;font-weight:900;color:var(--b);letter-spacing:.1em}
.lbl span{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
h2{font-size:clamp(28px,3.4vw,44px);font-weight:900;letter-spacing:-.035em;line-height:1.2}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:44px;border-top:2px solid var(--ink)}
.c{padding:30px 26px 30px 0;border-right:1px solid var(--line)}
.c:last-child{border-right:0;padding-right:0}
.c:not(:first-child){padding-left:26px}
.cn{font-family:var(--f-en);font-size:12px;font-weight:900;color:var(--b);letter-spacing:.12em}
.ct{margin-top:14px;font-size:17px;font-weight:900;line-height:1.45;letter-spacing:-.02em}
.cb{margin-top:12px;font-size:14px;line-height:1.8;color:var(--ink-2)}
/* 區塊之間的摺帶：一條會換色的帶子把版面「摺」過去 */
.fold{height:74px;display:flex}
.fold i{flex:1;height:100%}
.fold i:nth-child(1){background:var(--b-deep);border-radius:0 0 60px 0}
.fold i:nth-child(2){background:var(--b);border-radius:0 0 0 60px;flex:2}
.fold i:nth-child(3){background:var(--b-lt);border-radius:0 0 60px 0;flex:.8}
</style></head><body>
<div class="tag-dir">方向 A — 摺帶</div>

<header class="hero">
  <svg class="ribbon" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0050F0"/><stop offset="100%" stop-color="#0018A8"/></linearGradient>
      <linearGradient id="r2" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1878F0"/><stop offset="100%" stop-color="#0050F0"/></linearGradient>
    </defs>
    <!-- L 的大弧：logo 最有辨識度的一筆，放大成版面裝置 -->
    <path d="M980 -60 C1290 90, 1330 330, 1180 470 C1060 582, 900 560, 860 470" fill="none"
          stroke="url(#r1)" stroke-width="150" stroke-linecap="round" opacity=".85"/>
    <path d="M1120 -40 C1380 120, 1400 340, 1270 470" fill="none"
          stroke="url(#r2)" stroke-width="86" stroke-linecap="round" opacity=".7"/>
    <!-- 摺痕：一條淺色細帶壓在上面，模仿絲帶受光的摺 -->
    <path d="M1000 -20 C1270 120, 1300 330, 1165 445" fill="none"
          stroke="#60D0F0" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  </svg>

  <div class="wrap in">
    <nav class="nav">
      <img src="../assets/ftl-logo.png" alt="FTL">
      <span class="r">
        <a aria-current="page">首頁</a><a>關於我們</a><a>專案</a><a>洞察</a><a>資源</a><a>活動</a><a>聯絡我們</a>
      </span>
    </nav>
    <div style="padding:70px 0 0">
      <span class="kicker">政大商學院金融科技研究中心 指導成立</span>
      <h1>把課堂上的金融科技，<br><em>做成看得見的東西</em></h1>
      <p class="sub">政大第一個 FinTech 學術社團</p>
      <p class="desc">金融 × 科技 × 產學 × 實作。跨系、跨年級，你只需要想動手。</p>
      <div class="cta"><a class="btn">加入 FTL</a><a class="btn ghost">看看我們做了什麼</a></div>
    </div>
  </div>
  <div class="capstrip"><i></i><i></i><i></i><i></i></div>
</header>

<section class="sec"><div class="wrap">
  <div class="lbl"><b>01</b><span>Our mission</span></div>
  <h2>我們堅持的三件事</h2>
  <div class="cards">
    <div class="c"><div class="cn">01</div><div class="ct">做出來，不只是討論</div>
      <div class="cb">每學期每組都要交出一個能用的東西。「我們有研究」不算成果。</div></div>
    <div class="c"><div class="cn">02</div><div class="ct">金融與程式坐在同一張桌子</div>
      <div class="cb">分組刻意混編：財金、資管、統計、法律。互相聽不懂的地方就是好問題。</div></div>
    <div class="c"><div class="cn">03</div><div class="ct">一隻腳踩在業界</div>
      <div class="cb">每學期請業師來看我們的東西——不是演講，是針對成果的批評。</div></div>
  </div>
</div></section>
<div class="fold"><i></i><i></i><i></i></div>
</body></html>
